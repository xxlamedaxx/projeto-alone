<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        font-weight: normal;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1,
      h2,
      h3 {
    
        font-weight: normal;
      }

      #titulo {
        font-weight: bold;
        font-size: 24px;
        margin-bottom: 10px;
        text-align: center;
      }

      #baseUrl {
        font-weight: lighter;
        font-size: 18px;
        margin-bottom: 20px;
        text-align: center;
      }

      #descricao {
        text-align: center;
        max-width: 600px;
      }
        header {
            background-color: #99aa99;
            color: rgb(7, 41, 1);
            padding: 10px 0;
            text-align: center;
            width: 100%;
        }
    </style>
  </head>
  <body>
    <header>
    <h1 id="titulo">WebAPI e endpoints</h1>
    </header>
    <div>
    <h3 id="descricao">
      A API da Plataforma de Eventos segue os padrões REST e está organizada em
      três módulos principais: <b>Usuários</b>, <b>Eventos</b> e
      <b>Inscrições</b>. Todos os endpoints retornam dados em formato JSON e
      utilizam códigos de status HTTP apropriados.
    </h3>
    </div
    <h5 id="baseUrl">Base URL: http://localhost:3000/api</h5>
  </body>
</html>
